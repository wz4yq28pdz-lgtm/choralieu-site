<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Choralieu — A space is a memory waiting to be made</title>
<meta name="description" content="Choralieu — an event space and hospitality brand. Space to place." />

<link rel="preconnect" href="https://api.fontshare.com" />
<link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@500,700,800&display=swap" rel="stylesheet" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;1,8..60,400&display=swap" rel="stylesheet" />

<style>
  :root {
    --bg: #f7f3ec;
    --paper: #fcfaf5;
    --ink: #1e1e24;
    --ink-soft: #3a3a42;
    --scrim: #161411;

    --font-display: 'Cabinet Grotesk', 'Inter', sans-serif;
    --font-body: 'Source Serif 4', Georgia, serif;

    --text-xs: 0.75rem;
    --text-sm: 0.875rem;
    --text-base: 1rem;
    --text-lg: clamp(1.25rem, 1rem + 1vw, 1.75rem);
    --text-xl: clamp(1.75rem, 1.25rem + 2vw, 3rem);
    --text-2xl: clamp(2.25rem, 1.5rem + 3vw, 4.5rem);

    --space-2: 0.5rem;
    --space-3: 0.75rem;
    --space-4: 1rem;
    --space-6: 1.5rem;
    --space-8: 2rem;
    --space-12: 3rem;

    --ease: cubic-bezier(0.16, 1, 0.3, 1);
    --dur: 0.72s;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; text-rendering: optimizeLegibility; }

  body {
    font-family: var(--font-body);
    background: var(--ink);
    color: var(--ink);
    overflow: hidden;
    height: 100dvh;
  }

  a, button { font: inherit; color: inherit; cursor: pointer; background: none; border: none; text-decoration: none; }
  button { -webkit-tap-highlight-color: transparent; }

  .stage {
    position: relative;
    display: flex;
    width: 100%;
    height: 100dvh;
    overflow: hidden;
  }

  /* ---------- Panels ---------- */
  .panel {
    position: relative;
    flex: 1 1 0;
    min-width: 0;
    overflow: hidden;
    transition: flex var(--dur) var(--ease);
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: var(--space-12) var(--space-6);
    color: var(--paper);
    cursor: pointer;
    text-align: left;
  }

  .panel-img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform var(--dur) var(--ease), filter var(--dur) var(--ease);
  }
  .panel:hover .panel-img { transform: scale(1.04); }

  .panel-scrim {
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(22,20,17,0.62) 0%, rgba(22,20,17,0.12) 42%, rgba(22,20,17,0.04) 72%, transparent 100%);
    transition: background var(--dur) var(--ease);
    pointer-events: none;
  }

  .panel-label {
    position: relative;
    z-index: 2;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(2rem, 1.4rem + 3vw, 4rem);
    letter-spacing: -0.01em;
    line-height: 1;
    text-transform: uppercase;
    transition: transform var(--dur) var(--ease), font-size var(--dur) var(--ease), opacity var(--dur) var(--ease);
  }

  .panel-hint {
    position: absolute;
    top: var(--space-6);
    right: var(--space-6);
    z-index: 2;
    font-family: var(--font-display);
    font-size: var(--text-xs);
    letter-spacing: 0.16em;
    text-transform: uppercase;
    opacity: 0;
    transform: translateX(6px);
    transition: opacity 0.3s var(--ease), transform 0.3s var(--ease);
  }
  .panel:hover .panel-hint { opacity: 0.85; transform: translateX(0); }

  /* Expanded editorial content (hidden by default) */
  .panel-content {
    position: absolute;
    inset: 0;
    z-index: 3;
    padding: clamp(5rem, 12vh, 8rem) clamp(1.5rem, 6vw, 6rem);
    display: flex;
    flex-direction: column;
    justify-content: center;
    opacity: 0;
    transform: translateY(24px);
    transition: opacity 0.55s var(--ease), transform 0.55s var(--ease);
    pointer-events: none;
  }
  .panel-content-inner { max-width: 560px; margin-left: 18%; } /* left third as whitespace */

  /* Panels carrying the full Axis manifesto (Space, To) need expanded 8/10 width and top-anchored layout, not the centered 560px single-sentence treatment Place still uses */
  .panel--space .panel-content,
  .panel--to .panel-content {
    justify-content: flex-start;
    padding-top: clamp(4.5rem, 9vh, 6.5rem);
    overflow-y: auto;
  }
  .panel--space .panel-content-inner,
  .panel--to .panel-content-inner {
    max-width: 820px;
  }
  .panel--place .panel-content {
    justify-content: flex-start;
    overflow-y: auto;
  }
  .panel--place .panel-content-inner {
    margin-top: auto;
    margin-bottom: auto;
  }
  .panel--place .panel-body {
    font-size: var(--text-base);
    line-height: 1.5;
  }
  .panel--space .panel-headline,
  .panel--to .panel-headline,
  .panel--place .panel-headline {
    font-size: clamp(1.5rem, 1.1rem + 1.6vw, 2.25rem);
    line-height: 1.15;
    margin-bottom: var(--space-4);
  }
  .panel--space .panel-body,
  .panel--to .panel-body {
    display: block;
    max-width: none;
    font-size: var(--text-base);
    line-height: 1.5;
    columns: 2;
    column-gap: var(--space-8);
    margin-bottom: var(--space-6);
  }
  .panel--space .panel-body strong,
  .panel--to .panel-body strong,
  .panel--place .panel-body strong {
    font-family: var(--font-display);
    font-size: var(--text-xs);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    display: block;
    margin-top: var(--space-2);
    break-after: avoid;
  }
  .panel--space .panel-cta,
  .panel--to .panel-cta {
    display: block;
    margin-top: var(--space-2);
  }
  @media (max-width: 900px) {
    .panel--space .panel-body,
    .panel--to .panel-body { columns: 1; }
  }

  .panel-kicker {
    font-family: var(--font-display);
    font-size: var(--text-xs);
    letter-spacing: 0.22em;
    text-transform: uppercase;
    opacity: 0.7;
    margin-bottom: var(--space-4);
  }
  .panel-headline {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: var(--text-2xl);
    line-height: 1.02;
    letter-spacing: -0.02em;
    text-transform: uppercase;
    margin-bottom: var(--space-6);
  }
  .panel-body {
    font-size: var(--text-lg);
    line-height: 1.55;
    max-width: 46ch;
    margin-bottom: var(--space-8);
  }
  .panel-cta {
    display: inline-flex;
    align-items: center;
    gap: var(--space-2);
    font-family: var(--font-display);
    font-size: var(--text-sm);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    border-bottom: 1px solid currentColor;
    padding-bottom: 6px;
    transition: gap var(--dur) var(--ease);
  }
  .panel-cta:hover { gap: var(--space-4); }

  /* ---------- Sliver state ---------- */
  .stage.expanded .panel { padding: var(--space-6) var(--space-3); justify-content: flex-end; }
  .stage.expanded .panel:not(.active) .panel-label {
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    font-size: clamp(1rem, 0.5rem + 1.5vw, 1.5rem);
    align-self: center;
  }
  .stage.expanded .panel:not(.active) .panel-scrim { background: rgba(22,20,17,0.5); }
  .stage.expanded .panel:not(.active) .panel-hint { opacity: 0; }

  .stage.expanded .panel.active { flex: 8 1 0; cursor: default; }
  .stage.expanded .panel:not(.active) { flex: 1 1 0; }
  .stage.expanded .panel.active .panel-label { opacity: 0; }
  .stage.expanded .panel.active .panel-hint { opacity: 0; }
  .stage.expanded .panel.active .panel-scrim {
    background: linear-gradient(90deg, rgba(22,20,17,0.78) 0%, rgba(22,20,17,0.5) 55%, rgba(22,20,17,0.22) 100%);
  }
  .stage.expanded .panel.active .panel-content { opacity: 1; transform: translateY(0); pointer-events: auto; transition-delay: 0.15s; }

  /* ---------- The bar / threshold ---------- */
  .bar {
    position: absolute;
    left: 0;
    right: 0;
    top: 50%;
    transform: translateY(-50%);
    height: 84px;
    background: var(--ink);
    color: var(--paper);
    z-index: 20;
    pointer-events: none;
    transition: top var(--dur) var(--ease), height var(--dur) var(--ease);
  }
  .bar-inner {
    height: 100%;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    padding: 0 var(--space-6);
  }

  .bar-side { display: flex; align-items: center; gap: var(--space-4); }
  .bar-side--left { justify-content: flex-start; }
  .bar-side--right { justify-content: flex-end; }

  .bar-season {
    font-family: var(--font-display);
    font-size: var(--text-xs);
    letter-spacing: 0.16em;
    text-transform: uppercase;
    opacity: 0.55;
    transition: opacity var(--dur) var(--ease);
  }

  .bar-wordmark {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: clamp(1.9rem, 1.2rem + 3.5vw, 3.4rem);
    letter-spacing: 0.02em;
    text-transform: uppercase;
    line-height: 1;
    white-space: nowrap;
    pointer-events: auto;
    transition: font-size var(--dur) var(--ease);
  }

  .bar-tabs {
    display: flex;
    gap: var(--space-8);
    opacity: 0;
    transform: translateY(-8px);
    transition: opacity var(--dur) var(--ease), transform var(--dur) var(--ease);
    pointer-events: none;
  }
  .tab {
    font-family: var(--font-display);
    font-size: var(--text-sm);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    opacity: 0.6;
    position: relative;
    padding: 4px 0;
    pointer-events: auto;
    transition: opacity 0.25s var(--ease);
  }
  .tab:hover { opacity: 1; }
  .tab.active { opacity: 1; }
  .tab.active::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: -4px;
    height: 2px;
    background: var(--paper);
  }

  .bar-reserve {
    font-family: var(--font-display);
    font-size: var(--text-sm);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    border: 1px solid rgba(252,250,245,0.4);
    padding: 8px 18px;
    pointer-events: auto;
    transition: background 0.25s var(--ease), color 0.25s var(--ease);
  }
  .bar-reserve:hover { background: var(--paper); color: var(--ink); }

  .bar-close {
    display: grid;
    place-items: center;
    width: 36px; height: 36px;
    border: 1px solid rgba(252,250,245,0.35);
    font-size: 0.9rem;
    opacity: 0;
    pointer-events: none;
    transition: opacity var(--dur) var(--ease), background 0.25s var(--ease), color 0.25s var(--ease);
  }
  .bar-close:hover { background: var(--paper); color: var(--ink); }

  /* ---------- Expanded (bar → top menu) ---------- */
  .stage.expanded .bar { top: 0; transform: translateY(0); height: 72px; }
  .stage.expanded .bar-inner { grid-template-columns: auto 1fr auto; }
  .stage.expanded .bar-wordmark { font-size: 1.35rem; }
  .stage.expanded .bar-season { opacity: 0; }
  .stage.expanded .bar-tabs { opacity: 1; transform: translateY(0); pointer-events: auto; justify-self: center; }
  .stage.expanded .bar-close { opacity: 1; pointer-events: auto; }

  /* ---------- Mobile ---------- */
  @media (max-width: 720px) {
    .stage { flex-direction: column; }
    .panel { flex: 1 1 0; padding: var(--space-8) var(--space-6); }
    .panel-label { font-size: clamp(1.6rem, 1rem + 4vw, 2.6rem); }
    .panel-content-inner { margin-left: 0; }
    .bar { top: 50%; height: 64px; }
    .bar-wordmark { font-size: clamp(1.4rem, 1rem + 3vw, 2rem); }
    .bar-season { display: none; }
    .stage.expanded .panel { flex: 8 1 0; }
    .stage.expanded .panel:not(.active) { flex: 1 1 0; }
    .stage.expanded .panel:not(.active) .panel-label { writing-mode: horizontal-tb; transform: none; align-self: flex-start; }
    .stage.expanded .bar-tabs { gap: var(--space-4); }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body>

<div class="stage" id="stage">

  <!-- Panel 1 — The Space -->
  <button class="panel panel--space" data-panel="space" aria-label="Open The Space">
    <img class="panel-img" src="room.png" alt="" />
    <span class="panel-scrim"></span>
    <span class="panel-label">Space</span>
    <span class="panel-hint">Open →</span>
    <span class="panel-content">
      <span class="panel-content-inner">
        <span class="panel-kicker">01 — Space</span>
        <span class="panel-headline">A space is a memory waiting to be made.</span>
        <span class="panel-body">
          <strong>Axis — O</strong><br />
          Subtract the assumptions, the space tells you what it already wants to be. The void isn't the rival, it's the brief. Carrying delight without proving it. A space already contains the terms of its own answers — just be curious, find them.<br /><br />
          We ask a pragmatic question first, we don't decorate space with meaning — we arrange the answers until a person standing in it understands it, the work is disclosure, not invention.<br /><br />
          Constraint and delight are the same, subtract until only the truth is left standing, and let those terms be the whole.<br /><br />
          <strong style="break-before: column;">Axis — E</strong><br />
          A story everyone accepts has said nothing, so it will be forgotten. Take what already exists — a space as dance floor to tell that story, it doesn't need utility, or permission, to delight. Strip a space down, be deliberate, leave nowhere to hide — plaster over its certainty.<br /><br />
          Be not interested in what a room is supposed to do. Let the potential in. The dancefloor doesn't change; only what you're willing to believe about it changes, and occupying that aperture is the entire tune. Don't explain the trick, just feel the floor of your own assumptions give way — unsteadiness is the actual design.<br /><br />
          Be not interested in resolving contradictions. Widen that gap deliberately — a space that has been made perfectly consistent has been made forgettable.
        </span>

      </span>
    </span>
  </button>

  <!-- Panel 2 — To -->
  <button class="panel panel--to" data-panel="to" aria-label="Open To">
    <img class="panel-img" src="table.jpg" alt="" />
    <span class="panel-scrim"></span>
    <span class="panel-label">To</span>
    <span class="panel-hint">Open →</span>
    <span class="panel-content">
      <span class="panel-content-inner">
        <span class="panel-kicker">02 — To</span>
        <span class="panel-headline">To is a memory in motion.</span>
        <span class="panel-body">
          <strong>Axis — O</strong><br />
          A passage is a floor before it is a metaphor, a span it must hold. Movement doesn't need to mean anything to carry the load — it only needs to reach out in cadence; the meaning arrives on its own.<br /><br />
          Do not decorate the crossing; let the stability be felt, as a kind of arrival. Thresholds need not announce — the ascent tells you. Subtract the ceremony, and the bridge's one moment is getting from memory to possibility.<br /><br />
          <strong style="break-before: column;">Axis — E</strong><br />
          Don't explain or name the moment — once you call out what's on the other side, you've stopped crossing. You are meant to feel the gap open to uncertainty. You're already leaving and not yet arrived — neither moment owns you. The bridge doesn't resolve; it holds you in motion.
        </span>
        <a class="panel-cta" href="#" data-goto="place">Cross over →</a>
      </span>
    </span>
  </button>

  <!-- Panel 3 — The Place -->
  <button class="panel panel--place" data-panel="place" aria-label="Open The Place">
    <img class="panel-img" src="gathering.jpg" alt="" />
    <span class="panel-scrim"></span>
    <span class="panel-label">Place</span>
    <span class="panel-hint">Open →</span>
    <span class="panel-content">
      <span class="panel-content-inner">
        <span class="panel-kicker">03 — Place</span>
        <span class="panel-headline">A Place To Gather is where memories live.</span>
        <span class="panel-body"><strong>All Axes</strong><br />Place is the point where all axes meet. Space resolves to structure. A gathering resolves to feeling. And where they meet, memory resolves and becomes place.<br /><br />A memory can hold a gathering. Here, all are welcome, and you know you have arrived.</span>
        <a class="panel-cta" href="reserve.html">Arrive →</a>
      </span>
    </span>
  </button>

  <!-- The bar / threshold -->
  <div class="bar" id="bar">
    <div class="bar-inner">
      <div class="bar-side bar-side--left">
        <span class="bar-season">Est. 2026 · Late Summer</span>
      </div>
      <div class="bar-side bar-side--center">
        <a class="bar-wordmark" href="#" data-home aria-label="Choralieu home">CH<span class="wm-o">O</span>RALIEU</a>
        <nav class="bar-tabs" aria-label="Sections">
          <button class="tab" data-panel="space">Space</button>
          <button class="tab" data-panel="to">To</button>
          <button class="tab" data-panel="place">Place</button>
        </nav>
      </div>
      <div class="bar-side bar-side--right">
        <button class="bar-close" data-close aria-label="Close and return">✕</button>
        <a class="bar-reserve" href="reserve.html">Arrive</a>
      </div>
    </div>
  </div>

</div>

<script>
  const stage = document.getElementById('stage');
  const panels = document.querySelectorAll('.panel');
  const tabs = document.querySelectorAll('.tab');
  const wordmark = document.querySelector('.bar-wordmark');
  const closeBtn = document.querySelector('.bar-close');

  let active = null;

  function expand(id) {
    active = id;
    stage.classList.add('expanded');
    wordmark.style.transform = '';
    panels.forEach(p => p.classList.toggle('active', p.dataset.panel === id));
    tabs.forEach(t => t.classList.toggle('active', t.dataset.panel === id));
  }

  function collapse() {
    active = null;
    stage.classList.remove('expanded');
    panels.forEach(p => p.classList.remove('active'));
    tabs.forEach(t => t.classList.remove('active'));
    setTimeout(alignO, 800);
  }

  panels.forEach(p => {
    p.addEventListener('click', () => {
      if (active === p.dataset.panel) {
        collapse();
      } else {
        expand(p.dataset.panel);
      }
    });
  });

  tabs.forEach(t => {
    t.addEventListener('click', (e) => {
      e.stopPropagation();
      expand(t.dataset.panel);
    });
  });

  document.querySelectorAll('.panel-cta[data-goto]').forEach(cta => {
    cta.addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
      expand(cta.dataset.goto);
    });
  });

  closeBtn.addEventListener('click', collapse);
  wordmark.addEventListener('click', (e) => {
    e.preventDefault();
    collapse();
  });

  // Escape to collapse
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') collapse();
  });

  // Center the wordmark's "O" on the Space|To seam (left third) in the
  // collapsed triptych state, so the O reads as the pivot between panels.
  const wmO = document.querySelector('.wm-o');

  function alignO() {
    if (stage.classList.contains('expanded') || window.innerWidth <= 720 || !wmO) {
      wordmark.style.transform = '';
      return;
    }
    wordmark.style.transform = '';
    const o = wmO.getBoundingClientRect();
    const dx = window.innerWidth / 3 - (o.left + o.width / 2);
    wordmark.style.transform = 'translateX(' + dx.toFixed(2) + 'px)';
  }

  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function () { requestAnimationFrame(alignO); });
  }
  window.addEventListener('resize', alignO);
  requestAnimationFrame(alignO);

  // Deep-link: open the panel named in the URL hash (e.g. index.html#place).
  const hash = location.hash.replace('#', '');
  if (hash === 'space' || hash === 'to' || hash === 'place') {
    expand(hash);
  }
</script>
</body>
</html>
